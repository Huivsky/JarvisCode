name: Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Test and build Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: JarvisCode-Windows-x64
          path: |
            release/JarvisCodeSetup.exe
            release/JarvisCodeSetup.zip
            release/SHA256SUMS.txt
            release/JarvisCode-source-*.zip
          if-no-files-found: error
